[workspace]
resolver = "2"
members = ["crates/protocol", "crates/kernel"]

[workspace.package]
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
rquickjs = { version = "0.14.0", features = ["futures", "parallel", "loader"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
tempfile = "3.27"
libc = "0.2"

[profile.release]
opt-level = 3
debug = false
