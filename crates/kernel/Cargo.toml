[package]
name = "onedesk-kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
onedesk-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
rquickjs.workspace = true
tokio.workspace = true
rusqlite.workspace = true
semver.workspace = true
sha2.workspace = true
# openat/renameat for writes pinned to an already-resolved folder (review #7)
libc = "0.2"
# host.network (D307): system TLS only (native-tls → Security.framework), no rustls/ring.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
# Round 8: the file body of transfer.upload (64 KB chunks), through `reqwest::Body::wrap`. Both are
# already part of the build (reqwest / hyper use them): no new package in Cargo.lock.
http-body = "1"
bytes = "1"
# Keychain (D305): macOS native backend only.
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# D404: lists the accounts of the keychain service so a deleted workspace's entries can go by prefix (the same package keyring uses; MIT/Apache-2.0).
security-framework = "3"
# Round 17: `files.trash` through `NSFileManager trashItemAtURL:` (a process without Full Disk
# Access may not open ~/.Trash itself). Already in Cargo.lock through Tauri; MIT. Only what that
# call needs: objc2, objc2-encode, bitflags, libc (no new package).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString"] }
# D487 §15 (K-j): sorting by language (pinyin for Chinese); Unicode-3.0, like the ICU4X parts already in the tree.
icu_collator = { version = "2", optional = true }
icu_locale_core = { version = "2", optional = true }

[features]
# D487 §15 (K-j): sorting by language with ICU collation. Turned on by the worker (where the app's kernel runs), not by
# the host the window links: that keeps the window's build as it is.
collate = ["dep:icu_collator", "dep:icu_locale_core"]

[dev-dependencies]
tempfile.workspace = true
