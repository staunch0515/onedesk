[package]
name = "onedesk-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
default-run = "onedesk-mcp"
autotests = false

[lib]
name = "onedesk_mcp"
path = "src/lib.rs"

[[bin]]
name = "onedesk-mcp"
path = "src/main.rs"

[[test]]
name = "mcp"
path = "tests/mcp.rs"

[dependencies]
onedesk-protocol.workspace = true
onedesk-host.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
libc = "0.2"
tempfile.workspace = true
onedesk-kernel.workspace = true

[[bin]]
name = "fake-mcp-worker"
path = "tests/fake_worker.rs"
test = false
